<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Sales Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <h1 class="brand">ShopNest</h1>
        <button class="cart_btn" type="button" id="cart_toggle" aria-label="Open cart">
            <i class="fa fa-shopping-cart"></i>
            <span class="cart_count" id="cart_count">0</span>
        </button>
    </header>

    <main>
        <section class="sales" id="sales">
            <div class="sales_header">
                <div>
                    <h2>Weekend Mega Sale</h2>
                    <p>Up to 40% off on our best-selling items. Offer ends soon.</p>
                </div>
                <div class="countdown" id="countdown" aria-label="Time left on sale">
                    <div><span id="days">00</span><small>Days</small></div>
                    <div><span id="hours">00</span><small>Hours</small></div>
                    <div><span id="minutes">00</span><small>Mins</small></div>
                    <div><span id="seconds">00</span><small>Secs</small></div>
                </div>
            </div>

            <div class="filters" id="filters">
                <button class="filter active" data-category="all" type="button">All</button>
                <button class="filter" data-category="fashion" type="button">Fashion</button>
                <button class="filter" data-category="electronics" type="button">Electronics</button>
                <button class="filter" data-category="home" type="button">Home</button>
            </div>

            <div class="product_grid" id="product_grid"></div>
        </section>
    </main>

    <!-- Cart panel -->
    <div class="overlay" id="overlay"></div>
    <aside class="cart_panel" id="cart_panel" aria-label="Shopping cart">
        <div class="cart_head">
            <h3>Your Cart</h3>
            <button type="button" id="cart_close" aria-label="Close cart"><i class="fa fa-times"></i></button>
        </div>
        <div class="cart_items" id="cart_items"></div>
        <div class="cart_foot">
            <div class="cart_total"><span>Total</span><strong id="cart_total">₦0</strong></div>
            <button class="checkout" type="button" id="checkout">Checkout</button>
        </div>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <script src="script.js"></script>
</body>

</html>
